<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SO Milano — Применение</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Lato:wght@300;400;700&display=swap">
<style>
/* Layout: аскетичная сетка команды. Десктоп — две колонки, телефон — одна фигура под другой. Сезон переключается на каждом кадре отдельно. */
:root {
  --paper: #EFE9E3;      /* близко к фону съёмки, кадры не «висят» */
  --card:  #F6F2EE;
  --ink:   #1E1A16;
  --coal:  #3A2E28;
  --ash:   #8A7F74;
  --line:  rgba(30,26,22,.12);
  --chianti: #8B2635;
  --display: "Cormorant Garamond", Garamond, "Times New Roman", serif;
  --body: "Lato", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper:#17130F; --card:#211B17; --ink:#EFE9E3; --coal:#D9CEC3; --ash:#9C9086; --line:rgba(239,233,227,.14); --chianti:#C2475A; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper:#17130F; --card:#211B17; --ink:#EFE9E3; --coal:#D9CEC3; --ash:#9C9086; --line:rgba(239,233,227,.14); --chianti:#C2475A; color-scheme: dark }

* { box-sizing: border-box; }
body { margin:0; background: var(--paper); color: var(--ink); font-family: var(--body); font-weight: 300; font-size: 17px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
.wrap { padding-left: max(6vw, env(safe-area-inset-left, 0px)); padding-right: max(6vw, env(safe-area-inset-right, 0px)); }
@media (max-width: 768px) { .wrap { padding-left: max(5vw, env(safe-area-inset-left, 0px)); padding-right: max(5vw, env(safe-area-inset-right, 0px)); } }
.label { font-size: 11px; letter-spacing: 0; text-transform: uppercase; font-weight: 400; color: var(--ash); }

/* Шапка */
body::before { content:""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper); }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.bar .wrap { display:flex; align-items:center; justify-content:space-between; gap: 12px; padding-block: 10px; }
.brand { font-family: var(--display); font-size: 22px; letter-spacing: 0; }
.brand i { color: var(--chianti); }


/* Вступление */
.intro { padding-block: 64px 40px; display:grid; gap: 14px; }
.intro h1 { font-family: var(--display); font-weight: 400; font-size: clamp(40px, 7vw, 88px); line-height: .95; text-wrap: balance; margin: 0; letter-spacing: 0; }
.intro h1 em { color: var(--chianti); }
.concept { border-top: 1px solid var(--line); padding-block: 36px 32px; display:flex; justify-content:space-between; align-items:baseline; gap: 16px; flex-wrap: wrap; }
.concept h2 { font-family: var(--display); font-weight: 400; font-size: clamp(36px, 6vw, 64px); line-height: 1; margin: 0; }
.concept .desc { font-size: 15px; color: var(--coal); max-width: 36ch; }
.concept h2 em { color: var(--chianti); }
.concept .num { font-family: var(--display); font-style: italic; color: var(--chianti); font-size: 22px; margin-right: 14px; }

/* Сетка команды */
.grid { display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 64px 3vw; padding-bottom: 72px; }
.fig { margin: 0; display:grid; gap: 14px; }
.fig figcaption { display:flex; justify-content:space-between; align-items:baseline; gap: 12px; border-top: 1px solid var(--line); padding-top: 12px; }
.fig b { font-family: var(--display); font-weight: 500; font-size: 26px; line-height: 1.1; }
.fig i { font-family: var(--display); color: var(--ash); font-size: 17px; }

/* Кадр с двумя состояниями */
.shot { position: relative; aspect-ratio: 3 / 4; overflow: hidden; background: var(--card); }
.shot img { position:absolute; inset:0; width:100%; height:100%; object-fit: cover; display:block; transition: opacity .45s ease; }
.shot img.summer { opacity: 0; }
.fig[data-season="summer"] .shot img.summer { opacity: 1; }
.fig[data-season="summer"] .shot img.winter { opacity: 0; }

/* Переключатель на кадре */
.sw2 { position:absolute; right: 14px; top: 14px; display:inline-flex; padding: 3px; border-radius: 999px;
  background: rgba(255,255,255,.22); border: 1px solid rgba(255,255,255,.45); backdrop-filter: blur(12px) saturate(1.2); -webkit-backdrop-filter: blur(12px) saturate(1.2); }
.sw2 button { appearance:none; border:0; background:transparent; color: rgba(30,26,22,.62); font: 400 11px/1 var(--body); letter-spacing: 0; text-transform: uppercase;
  padding: 0 16px; min-height: 36px; border-radius: 999px; cursor:pointer; transition: background .25s, color .25s; }
.sw2 button[aria-pressed="true"] { background: rgba(255,255,255,.78); color: #1E1A16; }
.sw2 button:focus-visible { outline: 2px solid var(--chianti); outline-offset: 2px; }

.foot { border-top: 1px solid var(--line); padding-block: 24px 40px; display:flex; justify-content:space-between; gap: 12px; flex-wrap: wrap; }

@media (max-width: 768px) {
  .grid { grid-template-columns: minmax(0,1fr); gap: 40px; padding-bottom: 48px; }
  .intro { padding-block: 40px 28px; }
  .brand { font-size: 19px; }
}
@media (prefers-reduced-motion: reduce) { .shot img, .sw2 button { transition: none; } }
.back { display:inline-flex; align-items:center; gap:8px; color: var(--ink); text-decoration:none; font-size: 13px; }
.back:hover { color: var(--chianti); }
</style>
</head>
<body>

<div class="bar">
  <div class="wrap">
    <a class="back" href="index.html"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><polyline points="10,2 4,8 10,14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Все блоки</a>
    <div class="brand">SO <i>divisa</i></div>
    <span class="label">Версия 02</span>
  </div>
</div>

<main>
  <div class="wrap">
    <section class="intro">
      <span class="label">SO · Форма команды</span>
      <h1>Концепции внешнего вида <em>команды SO</em></h1>
    </section>
    <header class="concept">
      <h2><span class="num">01</span>Casual <em>Comfort</em></h2>
      <span class="desc">Весь комплект одежды выдаёт работодатель</span>
    </header>
    <section class="grid" id="grid-1"></section>
    <header class="concept">
      <h2><span class="num">02</span>Street<em>wear</em></h2>
      <span class="desc">Часть одежды выдаёт работодатель, часть — собственный гардероб сотрудника</span>
    </header>
    <section class="grid" id="grid-2"></section>
    <footer class="foot label"><span>SO · Divisa · Версия 02</span><span>Концепт для обсуждения</span></footer>
  </div>
</main>

<script>
const C1 = [
  { name:"Официантка", it:"Cameriera", w:"img_application/divisa/waiter-f-winter.jpg", s:"img_application/divisa/waiter-f-summer.jpg" },
  { name:"Официант", it:"Cameriere", w:"img_application/divisa/waiter-m-winter.jpg", s:"img_application/divisa/waiter-m-summer.jpg" },
  { name:"Бармен", it:"Barman", w:"img_application/divisa/barman.jpg" },
  { name:"Кальянщик", it:"Maestro del narghilè", w:"img_application/divisa/hookah-winter.jpg", s:"img_application/divisa/hookah.jpg" },
  { name:"Администратор", it:"Responsabile di sala", w:"img_application/divisa/admin.jpg", s:"img_application/divisa/admin-thin.jpg" },
  { name:"Повар", it:"Chef", w:"img_application/divisa/chef.jpg" }
];
const C2 = [
  { name:"Официантка", it:"Cameriera", w:"img_application/divisa/sw/waiter-f-winter.jpg", s:"img_application/divisa/sw/waiter-f-summer.jpg" },
  { name:"Официант", it:"Cameriere", w:"img_application/divisa/sw/waiter-m-winter.jpg", s:"img_application/divisa/sw/waiter-m-summer.jpg" },
  { name:"Бармен", it:"Barman", w:"img_application/divisa/sw/barman.jpg" },
  { name:"Кальянщик", it:"Maestro del narghilè", w:"img_application/divisa/sw/hookah-winter.jpg", s:"img_application/divisa/sw/hookah-summer.jpg" },
  { name:"Администратор", it:"Responsabile di sala", w:"img_application/divisa/sw/admin-winter.jpg", s:"img_application/divisa/sw/admin-summer.jpg" },
  { name:"Повар", it:"Chef", w:"img_application/divisa/sw/chef.jpg" }
];
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const render = (id, team, eager) => { document.getElementById(id).innerHTML = team.map((t, i) => `
  <figure class="fig" data-season="winter">
    <div class="shot">
      <img class="winter" src="${t.w}" alt="${esc(t.name)}${t.s ? ", зима" : ""}" loading="${eager && i < 2 ? "eager" : "lazy"}" width="1050" height="1406">
      ${t.s ? `<img class="summer" src="${t.s}" alt="${esc(t.name)}, лето" loading="lazy" width="1050" height="1406">
      <div class="sw2" role="group" aria-label="Сезон: ${esc(t.name)}">
        <button type="button" data-s="winter" aria-pressed="true">Зима</button>
        <button type="button" data-s="summer" aria-pressed="false">Лето</button>
      </div>` : ""}
    </div>
    <figcaption><b>${esc(t.name)}</b><i>${esc(t.it)}</i></figcaption>
  </figure>`).join(""); };
render("grid-1", C1, true);
render("grid-2", C2, false);
document.querySelector("main").addEventListener("click", e => {
  const b = e.target.closest(".sw2 button"); if (!b) return;
  const fig = b.closest(".fig"); fig.dataset.season = b.dataset.s;
  fig.querySelectorAll(".sw2 button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
});
</script>
</body>
</html>
